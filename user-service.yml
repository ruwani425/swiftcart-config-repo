server:
  port: 8081

spring:
  datasource:
    url: ${DB_URL:jdbc:h2:mem:userdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USER:sa}
    password: ${DB_PASS:}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: ${DB_DIALECT:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: update
    show-sql: true

gcp:
  storage:
    bucket-name: ${GCS_BUCKET_NAME:eca-user-avatars-bucket}
    project-id: ${GCP_PROJECT_ID:eca-enterprise-gcp-project}

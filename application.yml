# Common configuration shared across all microservices via Spring Cloud Config Server
spring:
  jackson:
    serialization:
      write-dates-as-timestamps: false

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_SERVER_URL:http://discovery.platform:8761/eureka/}
    registry-fetch-interval-seconds: 5
    healthcheck:
      enabled: false
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

logging:
  level:
    org.springframework.web: DEBUG
    com.eca: DEBUG
